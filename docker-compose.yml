# Router + Caddy (HTTPS) — docs/runbook.md "Router 배포 (Docker Compose)".
# Before `docker compose up -d`:
#   1. mkdir -p deploy/config && sudo chown 1000:1000 deploy/config   (the container's `node` user
#      writes config and secrets there)
#   2. Either run the web setup wizard (start with an empty deploy/config, open https://$GGJIRA_DOMAIN/ui/,
#      setup token is in `docker compose logs router`), or by hand:
#        cp deploy/router.config.example.json deploy/config/router.config.json   (edit it)
#        cp deploy/router.env.example deploy/config/router.env                   (fill in secrets)
#   3. export GGJIRA_DOMAIN=router.example.com  (DNS must point here; Caddy obtains the certificate)
services:
  router:
    build:
      context: .
      target: runtime
    image: ggjira-router:local
    restart: unless-stopped
    environment:
      # Lets `docker compose exec router node dist/cli.js router status` find the admin address
      # and token (config + secrets file live in /config, ADR 0023).
      GGJIRA_ROUTER_CONFIG: /config/router.config.json
      GGJIRA_ROUTER_SECRETS: /config/router.env
    volumes:
      # A directory, read-write: the web UI saves config edits here (atomic rename + .bak).
      - ./deploy/config:/config
      - router-data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - router
    ports:
      - "80:80"
      - "443:443"
    environment:
      GGJIRA_DOMAIN: ${GGJIRA_DOMAIN:?set GGJIRA_DOMAIN to the Router's public host name}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  router-data:
  caddy-data:
  caddy-config:
