# Runs the full check (typecheck, lint, format, tests — including the one-Router/two-worker
# integration scenario and the POSIX process-tree kill test) on Linux:
#   docker compose -f docker-compose.test.yml run --rm --build check
services:
  check:
    build:
      context: .
      target: test
    # An init process as PID 1 reaps orphaned grandchildren, as a host does; without it the
    # process-tree kill tests see killed processes linger as zombies.
    init: true
